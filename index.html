<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#111111">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<title>Comp Check</title>
<style>
  :root { --bg: #111; --panel: #1b1b1b; --line: #333; --fg: #eee; --dim: #8a8a8a; --accent: #f5b642; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 13px/1.4 system-ui, -apple-system, sans-serif; overflow: hidden; -webkit-user-select: none; user-select: none; }
  #app { display: flex; flex-direction: column; height: 100%; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  #bar { display: flex; flex-wrap: wrap; gap: 6px 10px; padding: 6px 8px; background: var(--panel); border-bottom: 1px solid var(--line); align-items: center; }
  #bar.min .tools { display: none; }
  .grp { display: flex; gap: 3px; align-items: center; flex-wrap: wrap; }
  .lbl { color: var(--dim); font-size: 11px; margin-right: 2px; }
  button, select { background: #262626; color: var(--fg); border: 1px solid #3a3a3a; border-radius: 6px; padding: 5px 9px; font: inherit; cursor: pointer; white-space: nowrap; }
  button.on { background: var(--accent); color: #111; border-color: var(--accent); }
  .chip { display: inline-flex; border-radius: 6px; overflow: hidden; }
  .chip button { border-radius: 0; max-width: 110px; overflow: hidden; text-overflow: ellipsis; }
  .chip button + button { padding: 5px 7px; border-left: none; }
  button:disabled { opacity: .4; }
  input[type=range] { width: 90px; accent-color: var(--accent); }
  #stage { flex: 1; position: relative; display: flex; align-items: center; justify-content: center; gap: 6px; min-height: 0; overflow: hidden; }
  canvas.view { background: #000; touch-action: none; display: block; }
  #hint { position: absolute; color: var(--dim); text-align: center; pointer-events: none; padding: 20px; line-height: 1.8; }
  #hist { position: absolute; left: 10px; bottom: 10px; background: rgba(0,0,0,.65); border-radius: 6px; pointer-events: none; }
  #strip { display: flex; gap: 6px; overflow-x: auto; padding: 6px 8px; background: var(--panel); border-top: 1px solid var(--line); min-height: 26px; align-items: center; }
  #strip img { height: 72px; border-radius: 4px; border: 2px solid transparent; cursor: pointer; flex: none; }
  #strip img.sel { border-color: var(--accent); }
  #strip .info { color: var(--dim); font-size: 11px; flex: none; padding-right: 4px; }
  #drop { position: absolute; inset: 0; border: 3px dashed var(--accent); background: rgba(245,182,66,.08); display: none; align-items: center; justify-content: center; font-size: 16px; pointer-events: none; z-index: 5; }
  #toast { position: fixed; left: 50%; top: 70px; transform: translateX(-50%); background: #333; padding: 8px 14px; border-radius: 6px; opacity: 0; transition: opacity .3s; pointer-events: none; z-index: 10; }
  input[type=file] { display: none; }

  /* iPhone → iPad ライブ映像 */
  #linkPanel { position: fixed; z-index: 30; left: 50%; top: calc(env(safe-area-inset-top) + 60px); transform: translateX(-50%); width: min(360px, calc(100vw - 24px)); background: #1e1e1e; border: 1px solid #444; border-radius: 10px; padding: 12px; box-shadow: 0 8px 30px rgba(0,0,0,.6); }
  #linkPanel .row { display: flex; gap: 6px; align-items: center; margin-bottom: 8px; flex-wrap: wrap; }
  #linkPanel input { flex: 1; min-width: 0; background: #262626; color: var(--fg); border: 1px solid #3a3a3a; border-radius: 6px; padding: 6px 8px; font: inherit; -webkit-user-select: text; user-select: text; }
  #lpStatus { color: #9cf; font-size: 12px; margin-bottom: 6px; min-height: 1em; }
  #lpList button { display: block; width: 100%; text-align: left; margin-bottom: 4px; white-space: normal; }

  /* 全画面: ツールバーとサムネイル列を隠し、タップで小さな操作ボタンを出す */
  body.fs #bar, body.fs #strip, body.fs #hint { display: none !important; }
  #fsCtl { position: fixed; top: calc(env(safe-area-inset-top) + 8px); right: calc(env(safe-area-inset-right) + 8px); display: none; gap: 6px; align-items: center; z-index: 20; background: rgba(0,0,0,.55); padding: 6px; border-radius: 8px; transition: opacity .3s; }
  body.fs #fsCtl { display: flex; }
  #fsCtl.hide { opacity: 0; pointer-events: none; }

  /* 横向きのスマホ: 高さが足りないので ツールバー=左 / サムネイル=右 の縦並びにする */
  @media (orientation: landscape) and (max-height: 540px) {
    #app { flex-direction: row; }
    #bar { flex-direction: column; flex-wrap: nowrap; align-items: flex-start; width: 190px; flex: none; overflow-y: auto; border-bottom: none; border-right: 1px solid var(--line); }
    #bar.min { width: auto; }
    #strip { flex-direction: column; width: 90px; flex: none; overflow-y: auto; overflow-x: hidden; border-top: none; border-left: 1px solid var(--line); }
    #strip img { height: auto; width: 70px; }
    #strip .info { white-space: normal; word-break: break-all; padding: 0; }
  }
</style>
</head>
<body>
<div id="app">
  <div id="bar">
    <button id="btnMin" title="ツールバーを畳む">☰</button>
    <div class="grp">
      <button id="btnCam">📷 カメラ</button>
      <select id="selCam" hidden></select>
      <button id="btnFreeze" disabled>⏸ 静止</button>
      <button id="btnImg">🖼 画像</button>
      <button id="btnRef">📁 参考を追加</button>
      <button id="btnPrev">◀</button><button id="btnNext">▶</button>
    </div>
    <div class="grp tools">
      <span class="lbl">表示</span>
      <button data-mode="overlay">重ね</button>
      <button data-mode="side">並べ</button>
      <button data-mode="wipe">ワイプ</button>
    </div>
    <div class="grp tools">
      <span class="lbl">透過</span>
      <input id="rngOpacity" type="range" min="0" max="100">
      <select id="selBlend"><option value="source-over">通常</option><option value="difference">差分</option></select>
    </div>
    <div class="grp tools">
      <span class="lbl">比率</span>
      <select id="selAspect"><option value="auto">自動(向き)</option><option>9:16</option><option>16:9</option><option>4:5</option><option>1:1</option></select>
    </div>
    <div class="grp tools">
      <span class="lbl">ガイド</span>
      <button data-guide="thirds">3分割</button>
      <button data-guide="phi">黄金比</button>
      <button data-guide="spiral">スパイラル</button>
      <button id="btnOri" title="スパイラルの向き">↻</button>
      <button data-guide="safe">セーフ</button>
      <button data-guide="shorts">Shorts UI</button>
      <button data-guide="center">中心</button>
    </div>
    <div class="grp tools" id="customGuides">
      <span class="lbl">PNG</span>
      <button id="btnGuidePng" title="透過PNGをガイドとして追加">＋追加</button>
      <input id="rngGuide" type="range" min="10" max="100" title="PNGガイドの濃さ">
      <button id="btnTemplate" title="テロップ制作用のテンプレートPNGを保存">テンプレ</button>
    </div>
    <div class="grp tools">
      <button id="btnHist">ヒストグラム</button>
      <button id="btnMirror">ミラー</button>
      <button id="btnSave">💾 保存</button>
      <button id="btnFs" title="全画面(F)">⛶ 全画面</button>
      <button id="btnLink" title="iPhoneのカメラ映像をiPadで見る">📡 iPad連携</button>
    </div>
  </div>
  <div id="stage">
    <div id="hint">📁 参考画像(またはカット分析のZIP)を追加 / ドロップ<br>📷 カメラ or 🖼 画像 で比較対象を表示<br>←→ で参考を切替 / 1・2・3 で表示モード<br>iPhone: 参考を追加 → ブラウズ → Dropbox のZIPを直接選べる</div>
    <canvas id="hist" width="256" height="96" hidden></canvas>
    <div id="drop">ここにドロップ</div>
  </div>
  <div id="strip"></div>
</div>
<div id="fsCtl">
  <button id="fsPrev">◀</button><button id="fsNext">▶</button>
  <input id="fsOpacity" type="range" min="0" max="100" title="透過">
  <button id="fsGuides" title="ガイドを一時的に隠す">ガイド</button>
  <button id="fsExit" title="全画面を終了">✕</button>
</div>
<div id="linkPanel" hidden>
  <div class="row" style="justify-content:space-between"><b>iPhone → iPad ライブ映像</b><button id="lpClose">✕</button></div>
  <div class="row"><input id="lpUrl" placeholder="中継サーバー https://<PC名>.<tailnet>.ts.net" inputmode="url" autocapitalize="off" autocorrect="off" spellcheck="false"></div>
  <div class="row"><button id="lpSend">このカメラを送る</button><button id="lpRecv">受信する</button><button id="lpStop" hidden>停止</button></div>
  <div id="lpStatus"></div>
  <div id="lpList"></div>
</div>
<div id="toast"></div>
<input id="fileRef" type="file" accept="image/*,.zip,application/zip" multiple>
<input id="fileImg" type="file" accept="image/*">
<input id="fileGuide" type="file" accept="image/png,image/webp,image/*" multiple>

<script>
(() => {
  const $ = (s) => document.querySelector(s);
  const PHI = (1 + Math.sqrt(5)) / 2;

  // ---- 設定(端末ごとに記憶) ----
  const DEF = {
    mode: 'overlay', opacity: 50, blend: 'source-over', aspect: 'auto', mirror: false, hist: false, spiralOri: 0, guideAlpha: 100, camId: '', sigUrl: '',
    guides: { thirds: true, phi: false, spiral: false, safe: false, shorts: true, center: false },
  };
  let ST = DEF;
  try { ST = { ...DEF, ...JSON.parse(localStorage.getItem('compcheck') || '{}') }; ST.guides = { ...DEF.guides, ...ST.guides }; } catch (e) {}
  const save = () => { try { localStorage.setItem('compcheck', JSON.stringify(ST)); } catch (e) {} };

  const toast = (msg) => {
    const t = $('#toast'); t.textContent = msg; t.style.opacity = 1;
    clearTimeout(toast.to); toast.to = setTimeout(() => { t.style.opacity = 0; }, 2500);
  };

  // ---- 比較対象(カメラ or 画像) ----
  const camVideo = document.createElement('video');
  camVideo.playsInline = true; camVideo.muted = true;
  let camStream = null, base = null; // base = { el, cam }
  const freezeCanvas = document.createElement('canvas');

  const srcSize = (el) => el instanceof HTMLVideoElement ? [el.videoWidth, el.videoHeight]
    : el instanceof HTMLImageElement ? [el.naturalWidth, el.naturalHeight] : [el.width, el.height];

  const stopCam = () => { if (camStream) camStream.getTracks().forEach((t) => t.stop()); camStream = null; };

  // 標準レンズ: 背面の物理1xレンズ(iPhoneの「背面カメラ」/「Back Camera」)
  // デュアル/トリプルは距離でレンズが勝手に切り替わる仮想カメラ、超広角は俯瞰だと周辺が歪むので除外
  const OTHER_LENS = /dual|triple|デュアル|トリプル|ultra|超広角|tele|望遠|front|前面|desk|デスク/i;
  const BACK = /back|rear|背面|environment/i;
  const pickMainBack = (devs) => devs.find((d) => BACK.test(d.label) && !OTHER_LENS.test(d.label));

  const openCam = (video) => navigator.mediaDevices.getUserMedia({ audio: false, video: { ...video, width: { ideal: 1920 }, height: { ideal: 1080 } } });

  // deviceId: カメラ選択欄で選んだとき。省略時は 前回選んだカメラ → 標準レンズ の順
  const startCam = async (deviceId) => {
    if (!navigator.mediaDevices?.getUserMedia) return toast('カメラはHTTPSで開いたときだけ使える');
    stopCam();
    const want = deviceId || ST.camId;
    try {
      camStream = want ? await openCam({ deviceId: { exact: want } }).catch(() => null) : null;
      // 前回のカメラが無くなっていたら記憶を消して標準レンズ選びに戻す
      if (!camStream && want === ST.camId) { ST.camId = ''; save(); }
      if (!camStream) camStream = await openCam({ facingMode: 'environment' });
    } catch (e) { return toast('カメラを開けない: ' + e.message); }
    // 権限が出たあとでないとラベルが取れない
    let devs = (await navigator.mediaDevices.enumerateDevices()).filter((d) => d.kind === 'videoinput');
    let curId = camStream.getVideoTracks()[0].getSettings().deviceId;
    if (deviceId) { ST.camId = deviceId; save(); }
    else if (!ST.camId || curId !== ST.camId) {
      // 自動で選ばれたのが仮想カメラなどなら、標準レンズで開き直す
      const main = pickMainBack(devs);
      if (main && main.deviceId !== curId) {
        stopCam();
        try { camStream = await openCam({ deviceId: { exact: main.deviceId } }); curId = main.deviceId; }
        catch (e) { camStream = await openCam({ facingMode: 'environment' }); curId = camStream.getVideoTracks()[0].getSettings().deviceId; }
      }
    }
    camVideo.srcObject = camStream;
    await camVideo.play();
    base = { el: camVideo, cam: true };
    const sel = $('#selCam');
    sel.replaceChildren(...devs.map((d, i) => new Option(
      (d.label || `カメラ${i + 1}`) + (d === pickMainBack(devs) ? '(標準)' : ''), d.deviceId, false, d.deviceId === curId)));
    sel.hidden = devs.length < 2;
    syncUI();
    onCamChanged();
  };

  const toggleFreeze = () => {
    if (!base?.cam) return;
    if (base.el === camVideo) {
      freezeCanvas.width = camVideo.videoWidth; freezeCanvas.height = camVideo.videoHeight;
      freezeCanvas.getContext('2d').drawImage(camVideo, 0, 0);
      base = { el: freezeCanvas, cam: true };
    } else base = { el: camVideo, cam: true };
    syncUI();
  };

  const loadImage = (blob) => new Promise((res, rej) => {
    const img = new Image();
    img.onload = () => res(img); img.onerror = rej;
    img.src = URL.createObjectURL(blob);
  });

  // ---- 参考画像 ----
  let refs = [], cur = -1, split = 0.5;
  const mime = (n) => /\.png$/i.test(n) ? 'image/png' : /\.webp$/i.test(n) ? 'image/webp' : 'image/jpeg';

  // ZIP読み込み(無圧縮と通常のdeflateに対応)
  const readZip = async (file) => {
    const buf = new Uint8Array(await file.arrayBuffer());
    const dv = new DataView(buf.buffer);
    let e = buf.length - 22;
    while (e >= 0 && dv.getUint32(e, true) !== 0x06054b50) e--;
    if (e < 0) throw new Error('ZIPとして読めない');
    const n = dv.getUint16(e + 10, true), dec = new TextDecoder();
    let p = dv.getUint32(e + 16, true);
    const out = [];
    for (let i = 0; i < n && dv.getUint32(p, true) === 0x02014b50; i++) {
      const method = dv.getUint16(p + 10, true), csize = dv.getUint32(p + 20, true);
      const nl = dv.getUint16(p + 28, true), xl = dv.getUint16(p + 30, true), cl = dv.getUint16(p + 32, true);
      const lo = dv.getUint32(p + 42, true);
      const name = dec.decode(buf.subarray(p + 46, p + 46 + nl));
      p += 46 + nl + xl + cl;
      if (!/\.(jpe?g|png|webp)$/i.test(name) || name.includes('__MACOSX')) continue;
      const ds = lo + 30 + dv.getUint16(lo + 26, true) + dv.getUint16(lo + 28, true);
      const raw = new Blob([buf.subarray(ds, ds + csize)]);
      let blob;
      if (method === 0) blob = raw;
      else if (method === 8) blob = await new Response(raw.stream().pipeThrough(new DecompressionStream('deflate-raw'))).blob();
      else continue;
      out.push({ name: name.split('/').pop(), blob: new Blob([blob], { type: mime(name) }) });
    }
    return out;
  };

  const addFiles = async (files) => {
    const items = [];
    for (const f of files) {
      try {
        if (/\.zip$/i.test(f.name) || f.type.includes('zip')) items.push(...await readZip(f));
        else if (f.type.startsWith('image/')) items.push({ name: f.name, blob: f });
      } catch (e) { toast(`${f.name}: ${e.message}`); }
    }
    items.sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true }));
    for (const it of items) {
      try { refs.push({ name: it.name, img: await loadImage(it.blob) }); } catch (e) {}
    }
    if (items.length) toast(`${items.length}枚追加`);
    if (cur < 0 && refs.length) cur = 0;
    renderStrip();
  };

  const select = (i) => {
    if (!refs.length) return;
    cur = (i + refs.length) % refs.length;
    renderStrip();
  };

  const renderStrip = () => {
    const strip = $('#strip');
    const info = document.createElement('span');
    info.className = 'info';
    info.textContent = refs.length ? `${cur + 1}/${refs.length}  ${refs[cur].name}` : '参考画像なし';
    const clear = document.createElement('button');
    clear.textContent = '全消去';
    clear.onclick = () => { refs.forEach((r) => URL.revokeObjectURL(r.img.src)); refs = []; cur = -1; renderStrip(); };
    strip.replaceChildren(info, ...(refs.length ? [clear] : []), ...refs.map((r, i) => {
      const im = document.createElement('img');
      im.src = r.img.src; im.title = r.name;
      if (i === cur) im.className = 'sel';
      im.onclick = () => select(i);
      return im;
    }));
    strip.querySelector('img.sel')?.scrollIntoView({ block: 'nearest', inline: 'center' });
    $('#hint').hidden = !!(refs.length || base);
  };

  // ---- PNGガイド(テロップ位置など。IndexedDBに保存して次回も使う) ----
  const idb = (() => {
    let dbp;
    const open = () => dbp || (dbp = new Promise((res, rej) => {
      const r = indexedDB.open('compcheck', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('guides', { keyPath: 'id' });
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    }));
    const tx = async (mode, fn) => {
      const db = await open();
      return new Promise((res, rej) => {
        const t = db.transaction('guides', mode), req = fn(t.objectStore('guides'));
        t.oncomplete = () => res(req.result);
        t.onerror = () => rej(t.error);
      });
    };
    return { all: () => tx('readonly', (s) => s.getAll()), put: (v) => tx('readwrite', (s) => s.put(v)), del: (id) => tx('readwrite', (s) => s.delete(id)) };
  })();
  let customGuides = []; // { id, name, blob, on, img }

  const saveGuide = (g) => idb.put({ id: g.id, name: g.name, blob: g.blob, on: g.on }).catch(() => toast('ガイドを保存できなかった(この端末では次回は消える)'));

  const renderGuideChips = () => {
    const box = $('#customGuides');
    box.querySelectorAll('.chip').forEach((c) => c.remove());
    for (const g of customGuides) {
      const name = document.createElement('button');
      name.textContent = g.name.replace(/\.[^.]+$/, '');
      name.title = g.name;
      name.classList.toggle('on', g.on);
      name.onclick = () => { g.on = !g.on; saveGuide(g); renderGuideChips(); };
      const del = document.createElement('button');
      del.textContent = '×';
      del.title = '削除';
      del.onclick = () => {
        if (!confirm(`ガイド「${g.name}」を削除する?`)) return;
        customGuides = customGuides.filter((x) => x !== g);
        URL.revokeObjectURL(g.img.src);
        idb.del(g.id).catch(() => {});
        renderGuideChips();
      };
      const chip = document.createElement('span');
      chip.className = 'chip';
      chip.append(name, del);
      box.insertBefore(chip, $('#rngGuide'));
    }
  };

  const addGuides = async (files) => {
    for (const f of files) {
      if (!f.type.startsWith('image/')) continue;
      try {
        const g = { id: `${Date.now()}-${Math.random().toString(36).slice(2, 7)}`, name: f.name, blob: f, on: true, img: await loadImage(f) };
        customGuides.push(g);
        saveGuide(g);
      } catch (e) { toast(`${f.name} を読めない`); }
    }
    renderGuideChips();
  };

  const loadSavedGuides = async () => {
    try {
      for (const g of await idb.all()) customGuides.push({ ...g, img: await loadImage(g.blob) });
    } catch (e) {}
    renderGuideChips();
  };

  // フレームと縦横比がほぼ同じなら全面に、違う場合は比率を保って中央に収める
  const drawCustomGuides = (ctx, w, h) => {
    const on = customGuides.filter((g) => g.on);
    if (!on.length) return;
    ctx.save();
    ctx.globalAlpha = ST.guideAlpha / 100;
    for (const g of on) {
      const iw = g.img.naturalWidth, ih = g.img.naturalHeight;
      if (Math.abs(iw / ih - w / h) < 0.02 * (w / h)) ctx.drawImage(g.img, 0, 0, w, h);
      else {
        const s = Math.min(w / iw, h / ih);
        ctx.drawImage(g.img, (w - iw * s) / 2, (h - ih * s) / 2, iw * s, ih * s);
      }
    }
    ctx.restore();
  };

  // ---- 描画 ----
  const stage = $('#stage');
  let views = [];
  const ensureViews = (n) => {
    while (views.length < n) {
      const c = document.createElement('canvas');
      c.className = 'view';
      c.addEventListener('pointerdown', onPointer);
      c.addEventListener('pointermove', (e) => { if (e.buttons) onPointer(e); });
      stage.insertBefore(c, $('#hist'));
      views.push(c);
    }
    while (views.length > n) views.pop().remove();
  };
  const onPointer = (e) => {
    if (ST.mode !== 'wipe') return;
    const r = e.target.getBoundingClientRect();
    split = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width));
  };

  const drawCover = (ctx, el, w, h, mirror) => {
    const [sw, sh] = srcSize(el);
    if (!sw || !sh) return;
    const s = Math.max(w / sw, h / sh), dw = sw * s, dh = sh * s;
    ctx.save();
    if (mirror) { ctx.translate(w, 0); ctx.scale(-1, 1); }
    ctx.drawImage(el, (w - dw) / 2, (h - dh) / 2, dw, dh);
    ctx.restore();
  };
  const drawBase = (ctx, w, h) => base && drawCover(ctx, base.el, w, h, base.cam && ST.mirror);
  const drawRef = (ctx, w, h) => cur >= 0 && drawCover(ctx, refs[cur].img, w, h, false);

  // 黄金スパイラル: 横長の黄金矩形(φ×1)で四分円をつないだ点列を0〜1に正規化
  const spiralPts = (() => {
    const pts = [], sq = [];
    let x = 0, y = 0, w = PHI, h = 1;
    for (let k = 0; k < 12; k++) {
      let cx, cy, a0, s;
      switch (k % 4) {
        case 0: s = h; cx = x + s; cy = y + s; a0 = Math.PI; sq.push([x + s, y, x + s, y + h]); x += s; w -= s; break;
        case 1: s = w; cx = x; cy = y + s; a0 = Math.PI * 1.5; sq.push([x, y + s, x + w, y + s]); y += s; h -= s; break;
        case 2: s = h; cx = x + w - s; cy = y; a0 = 0; sq.push([x + w - s, y, x + w - s, y + h]); w -= s; break;
        case 3: s = w; cx = x + s; cy = y + h - s; a0 = Math.PI * 0.5; sq.push([x, y + h - s, x + w, y + h - s]); h -= s; break;
      }
      for (let i = 0; i <= 16; i++) {
        const a = a0 + (Math.PI / 2) * (i / 16);
        pts.push([(cx + s * Math.cos(a)) / PHI, cy + s * Math.sin(a)]);
      }
    }
    return { pts, sq: sq.map(([a, b, c, d]) => [a / PHI, b, c / PHI, d]) };
  })();

  // 比率「自動」は端末の向きに合わせる(縦持ち 9:16 / 横持ち 16:9)
  const aspect = () => (ST.aspect === 'auto' ? (innerWidth > innerHeight ? '16:9' : '9:16') : ST.aspect);
  let guidesHidden = false; // 全画面中に一時的に隠す(保存しない)

  const drawGuides = (ctx, w, h, dpr = devicePixelRatio || 1, withCustom = true) => {
    if (guidesHidden && withCustom) return;
    const G = ST.guides;
    if (withCustom) drawCustomGuides(ctx, w, h);
    const stroke = (path, color = 'rgba(255,255,255,.85)', width = 1) => {
      ctx.save();
      ctx.lineWidth = (width + 2) * dpr; ctx.strokeStyle = 'rgba(0,0,0,.45)'; path(); ctx.stroke();
      ctx.lineWidth = width * dpr; ctx.strokeStyle = color; path(); ctx.stroke();
      ctx.restore();
    };
    const grid = (fs, color) => stroke(() => {
      ctx.beginPath();
      for (const f of fs) { ctx.moveTo(w * f, 0); ctx.lineTo(w * f, h); ctx.moveTo(0, h * f); ctx.lineTo(w, h * f); }
    }, color);
    if (G.thirds) grid([1 / 3, 2 / 3]);
    if (G.phi) grid([1 - 1 / PHI, 1 / PHI], 'rgba(245,182,66,.95)');
    if (G.center) stroke(() => {
      const r = Math.min(w, h) * 0.04;
      ctx.beginPath(); ctx.moveTo(w / 2 - r, h / 2); ctx.lineTo(w / 2 + r, h / 2); ctx.moveTo(w / 2, h / 2 - r); ctx.lineTo(w / 2, h / 2 + r);
    });
    if (G.safe) {
      for (const [f, dash] of [[0.93, []], [0.9, [6, 4]]]) {
        stroke(() => { ctx.setLineDash(dash.map((d) => d * dpr)); ctx.beginPath(); ctx.rect(w * (1 - f) / 2, h * (1 - f) / 2, w * f, h * f); }, 'rgba(120,220,255,.9)');
      }
    }
    if (G.spiral) {
      // 縦長フレームでは縦横を入れ替え、向きは反転の組み合わせで4通り
      const portrait = h > w, fx = ST.spiralOri & 1, fy = ST.spiralOri & 2;
      const map = ([nx, ny]) => {
        let X = portrait ? ny : nx, Y = portrait ? nx : ny;
        if (fx) X = 1 - X; if (fy) Y = 1 - Y;
        return [X * w, Y * h];
      };
      stroke(() => {
        ctx.beginPath();
        for (const [a, b, c, d] of spiralPts.sq) { ctx.moveTo(...map([a, b])); ctx.lineTo(...map([c, d])); }
      }, 'rgba(245,182,66,.35)');
      stroke(() => {
        ctx.beginPath();
        spiralPts.pts.forEach((p, i) => (i ? ctx.lineTo(...map(p)) : ctx.moveTo(...map(p))));
      }, 'rgba(245,182,66,.95)', 1.5);
    }
    if (G.shorts && aspect() === '9:16') {
      // Shortsのタイトル・ボタン類が被るおおよその領域
      ctx.save();
      ctx.fillStyle = 'rgba(255,60,60,.18)';
      ctx.fillRect(0, 0, w, h * 0.11);
      ctx.fillRect(0, h * 0.75, w, h * 0.25);
      ctx.fillRect(w * 0.87, h * 0.11, w * 0.13, h * 0.64);
      ctx.fillStyle = 'rgba(255,255,255,.7)'; ctx.font = `${10 * dpr}px system-ui`;
      ctx.fillText('Shorts UI', 6 * dpr, h * 0.75 + 14 * dpr);
      ctx.restore();
    }
  };

  const label = (ctx, text) => {
    const dpr = devicePixelRatio || 1;
    ctx.save();
    ctx.font = `bold ${11 * dpr}px system-ui`;
    const tw = ctx.measureText(text).width;
    ctx.fillStyle = 'rgba(0,0,0,.6)'; ctx.fillRect(6 * dpr, 6 * dpr, tw + 10 * dpr, 18 * dpr);
    ctx.fillStyle = '#fff'; ctx.fillText(text, 11 * dpr, 19 * dpr);
    ctx.restore();
  };

  const layout = () => {
    const n = ST.mode === 'side' ? 2 : 1;
    ensureViews(n);
    const [aw, ah] = aspect().split(':').map(Number), a = aw / ah, gap = 6;
    const W = stage.clientWidth - 12, H = stage.clientHeight - 12;
    let vh, dir = 'row';
    if (n === 1) vh = Math.min(H, W / a);
    else {
      const hRow = Math.min(H, (W - gap) / 2 / a), hCol = Math.min((H - gap) / 2, W / a);
      vh = Math.max(hRow, hCol); dir = hRow >= hCol ? 'row' : 'column';
    }
    stage.style.flexDirection = dir;
    const dpr = devicePixelRatio || 1, cw = Math.round(vh * a), chh = Math.round(vh);
    for (const c of views) {
      c.style.width = cw + 'px'; c.style.height = chh + 'px';
      if (c.width !== cw * dpr || c.height !== chh * dpr) { c.width = cw * dpr; c.height = chh * dpr; }
    }
  };

  const render = () => {
    layout();
    const [c0, c1] = views, ctx = c0.getContext('2d'), w = c0.width, h = c0.height;
    ctx.clearRect(0, 0, w, h);
    if (ST.mode === 'overlay') {
      drawBase(ctx, w, h);
      ctx.save();
      ctx.globalAlpha = base ? ST.opacity / 100 : 1;
      ctx.globalCompositeOperation = base ? ST.blend : 'source-over';
      drawRef(ctx, w, h);
      ctx.restore();
      drawGuides(ctx, w, h);
    } else if (ST.mode === 'wipe') {
      drawBase(ctx, w, h);
      ctx.save(); ctx.beginPath(); ctx.rect(0, 0, w * split, h); ctx.clip(); drawRef(ctx, w, h); ctx.restore();
      ctx.fillStyle = '#fff'; ctx.fillRect(w * split - 1, 0, 2 * (devicePixelRatio || 1), h);
      drawGuides(ctx, w, h);
      label(ctx, '◀ 参考 | 現在 ▶');
    } else {
      drawRef(ctx, w, h); drawGuides(ctx, w, h); label(ctx, cur >= 0 ? `参考 ${cur + 1}/${refs.length}` : '参考');
      const ctx1 = c1.getContext('2d');
      ctx1.clearRect(0, 0, c1.width, c1.height);
      drawBase(ctx1, c1.width, c1.height); drawGuides(ctx1, c1.width, c1.height); label(ctx1, '現在');
    }
    if (ST.hist && ++render.n % 6 === 0) drawHist();
    requestAnimationFrame(render);
  };
  render.n = 0;

  // ---- ヒストグラム(ライティング比較: 橙=参考 / 水色=現在) ----
  const hc = document.createElement('canvas');
  hc.width = 64; hc.height = 64;
  const hctx = hc.getContext('2d', { willReadFrequently: true });
  const lumaHist = (draw) => {
    hctx.clearRect(0, 0, 64, 64);
    draw(hctx, 64, 64);
    const d = hctx.getImageData(0, 0, 64, 64).data, bins = new Float32Array(64);
    let sum = 0;
    for (let i = 0; i < d.length; i += 4) {
      const y = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2];
      bins[y >> 2]++; sum += y;
    }
    return { bins, mean: sum / (d.length / 4) };
  };
  const drawHist = () => {
    const c = $('#hist'), ctx = c.getContext('2d'), W = c.width, H = c.height - 16;
    ctx.clearRect(0, 0, c.width, c.height);
    const sets = [];
    if (cur >= 0) sets.push([lumaHist(drawRef), 'rgba(245,182,66,.6)', '参考']);
    if (base) sets.push([lumaHist(drawBase), 'rgba(90,200,255,.6)', '現在']);
    sets.forEach(([hs, col, name], k) => {
      const max = Math.max(...hs.bins);
      ctx.fillStyle = col;
      ctx.beginPath(); ctx.moveTo(0, H);
      hs.bins.forEach((v, i) => ctx.lineTo((i + 0.5) * W / 64, H - (v / max) * (H - 4)));
      ctx.lineTo(W, H); ctx.fill();
      ctx.font = '10px system-ui';
      ctx.fillText(`${name} 平均輝度 ${Math.round(hs.mean)}`, 4 + k * 128, H + 12);
    });
  };

  // ---- 保存(表示中のビューをPNGで) ----
  const saveImage = () => {
    const gap = 8, row = stage.style.flexDirection !== 'column';
    const out = document.createElement('canvas');
    const w = views[0].width, h = views[0].height;
    out.width = row ? w * views.length + gap * (views.length - 1) : w;
    out.height = row ? h : h * views.length + gap * (views.length - 1);
    const ctx = out.getContext('2d');
    ctx.fillStyle = '#000'; ctx.fillRect(0, 0, out.width, out.height);
    views.forEach((v, i) => ctx.drawImage(v, row ? i * (w + gap) : 0, row ? 0 : i * (h + gap)));
    out.toBlob((b) => {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(b);
      a.download = `compcheck_${new Date().toISOString().replace(/[:.]/g, '-').slice(0, 19)}.png`;
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    }, 'image/png');
  };

  // テロップ制作用: 今の比率・今オンのガイドで、短辺1080pxの透過PNGを書き出す
  const saveTemplate = () => {
    const [aw, ah] = aspect().split(':').map(Number);
    const s = 1080 / Math.min(aw, ah), c = document.createElement('canvas');
    c.width = Math.round(aw * s); c.height = Math.round(ah * s);
    drawGuides(c.getContext('2d'), c.width, c.height, c.width / 360, false);
    c.toBlob((b) => {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(b);
      a.download = `compcheck_template_${aw}x${ah}_${c.width}x${c.height}.png`;
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    }, 'image/png');
  };

  // ---- UI ----
  const syncUI = () => {
    document.querySelectorAll('[data-mode]').forEach((b) => b.classList.toggle('on', b.dataset.mode === ST.mode));
    document.querySelectorAll('[data-guide]').forEach((b) => b.classList.toggle('on', ST.guides[b.dataset.guide]));
    $('#rngOpacity').value = ST.opacity;
    $('#rngGuide').value = ST.guideAlpha;
    $('#selBlend').value = ST.blend;
    $('#selAspect').value = ST.aspect;
    $('#btnHist').classList.toggle('on', ST.hist);
    $('#hist').hidden = !ST.hist;
    $('#btnMirror').classList.toggle('on', ST.mirror);
    $('#btnCam').classList.toggle('on', !!camStream);
    $('#btnFreeze').disabled = !base?.cam;
    $('#btnFreeze').classList.toggle('on', !!(base?.cam && base.el !== camVideo));
    $('#hint').hidden = !!(refs.length || base);
    save();
  };

  document.querySelectorAll('[data-mode]').forEach((b) => { b.onclick = () => { ST.mode = b.dataset.mode; syncUI(); }; });
  document.querySelectorAll('[data-guide]').forEach((b) => { b.onclick = () => { ST.guides[b.dataset.guide] = !ST.guides[b.dataset.guide]; syncUI(); }; });
  $('#btnOri').onclick = () => { ST.spiralOri = (ST.spiralOri + 1) % 4; ST.guides.spiral = true; syncUI(); };
  $('#rngOpacity').oninput = (e) => { ST.opacity = +e.target.value; save(); };
  $('#rngGuide').oninput = (e) => { ST.guideAlpha = +e.target.value; save(); };
  $('#btnGuidePng').onclick = () => $('#fileGuide').click();
  $('#fileGuide').onchange = (e) => { addGuides([...e.target.files]); e.target.value = ''; };
  $('#btnTemplate').onclick = saveTemplate;
  $('#selBlend').onchange = (e) => { ST.blend = e.target.value; syncUI(); };
  $('#selAspect').onchange = (e) => { ST.aspect = e.target.value; syncUI(); };
  $('#btnHist').onclick = () => { ST.hist = !ST.hist; syncUI(); };
  $('#btnMirror').onclick = () => { ST.mirror = !ST.mirror; syncUI(); };
  $('#btnMin').onclick = () => $('#bar').classList.toggle('min');
  $('#btnCam').onclick = () => {
    if (camStream) { stopLink(); stopCam(); base = null; $('#selCam').hidden = true; syncUI(); } else startCam();
  };
  $('#selCam').onchange = (e) => startCam(e.target.value);
  $('#btnFreeze').onclick = toggleFreeze;
  $('#btnImg').onclick = () => $('#fileImg').click();
  $('#btnRef').onclick = () => $('#fileRef').click();
  $('#btnPrev').onclick = () => select(cur - 1);
  $('#btnNext').onclick = () => select(cur + 1);
  $('#btnSave').onclick = saveImage;
  $('#fileRef').onchange = (e) => { addFiles([...e.target.files]); e.target.value = ''; };
  $('#fileImg').onchange = async (e) => {
    const f = e.target.files[0]; e.target.value = '';
    if (!f) return;
    stopCam(); $('#selCam').hidden = true;
    base = { el: await loadImage(f), cam: false };
    syncUI();
  };

  // ---- iPhone → iPad ライブ映像(WebRTC) ----
  // 接続情報(SDP)だけ自宅PCの中継サーバー(signal/server.js、tailnet内専用)で受け渡し、映像は端末間で直接送る
  const RTC_CFG = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };
  const rid = () => Math.random().toString(36).slice(2, 10) + Math.random().toString(36).slice(2, 6);
  const remoteVideo = document.createElement('video');
  remoteVideo.playsInline = true; remoteVideo.muted = true; remoteVideo.autoplay = true;
  const link = { role: null, es: null, room: null, me: rid(), pcs: new Map(), listTimer: 0 };
  const sigBase = () => (ST.sigUrl || '').trim().replace(/\/+$/, '');
  const syncSigUrl = () => {
    const v = $('#lpUrl').value.trim();
    if (v && v !== ST.sigUrl) { ST.sigUrl = v; save(); }
  };
  const sigErr = (e) => lpStatus(`中継サーバーにつながらない: ${sigBase()} (${e?.message || e})。Tailscaleがオンか確認`);
  const lpStatus = (s) => { $('#lpStatus').textContent = s; };
  const sigPost = (msg) => fetch(`${sigBase()}/rooms/${link.room}`, {
    method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify({ ...msg, from: link.me }),
  }).catch(() => lpStatus('中継サーバーに送れない'));
  // 接続情報を1回で送るため、ICE候補が出そろうまで待つ
  const gathered = (pc) => pc.iceGatheringState === 'complete' ? Promise.resolve() : new Promise((r) => {
    const t = setTimeout(r, 2500);
    pc.addEventListener('icegatheringstatechange', () => { if (pc.iceGatheringState === 'complete') { clearTimeout(t); r(); } });
  });
  const deviceName = () => {
    const ua = navigator.userAgent;
    const kind = /iPhone/.test(ua) ? 'iPhone' : /iPad/.test(ua) || (/Macintosh/.test(ua) && 'ontouchend' in document) ? 'iPad' : /Android/.test(ua) ? 'Android' : 'PC';
    return `${kind} · ${$('#selCam').selectedOptions[0]?.text || 'カメラ'}`;
  };
  const connectedCount = () => [...link.pcs.values()].filter((pc) => pc.connectionState === 'connected').length;
  const updateLinkUI = () => {
    $('#btnLink').classList.toggle('on', !!link.role);
    $('#lpStop').hidden = !link.role;
    $('#lpSend').hidden = $('#lpRecv').hidden = !!link.role;
    if (link.role === 'send') lpStatus(`送信中: ${deviceName()} / 視聴 ${connectedCount()}台`);
  };

  const openEvents = (query) => new Promise((resolve, reject) => {
    const es = new EventSource(`${sigBase()}/rooms/${link.room}/events?peer=${link.me}${query}`);
    es.onopen = () => resolve(es);
    es.onerror = () => { if (es.readyState === EventSource.CLOSED) reject(new Error('接続を拒否された')); };
    setTimeout(() => { if (es.readyState !== EventSource.OPEN) { es.close(); reject(new Error('6秒応答なし')); } }, 6000);
  });

  // 送信(iPhone): カメラ映像を、参加してきた端末ごとに送る
  const startSend = async () => {
    syncSigUrl();
    if (!sigBase()) return lpStatus('中継サーバーのURLを入れて');
    if (!camStream) await startCam();
    if (!camStream) return;
    link.role = 'send'; link.room = rid();
    lpStatus('中継サーバーに接続中…');
    try { link.es = await openEvents(`&name=${encodeURIComponent(deviceName())}`); }
    catch (e) { link.role = null; updateLinkUI(); return sigErr(e); }
    link.es.onmessage = async (e) => {
      const m = JSON.parse(e.data);
      if (m.type === 'peer-join') {
        link.pcs.get(m.from)?.close();
        const pc = new RTCPeerConnection(RTC_CFG);
        link.pcs.set(m.from, pc);
        for (const t of camStream.getVideoTracks()) pc.addTrack(t, camStream);
        pc.onconnectionstatechange = updateLinkUI;
        await pc.setLocalDescription(await pc.createOffer());
        // 家のWi-Fiなら高画質で(上限 6Mbps)
        for (const s of pc.getSenders()) {
          const p = s.getParameters();
          p.encodings = p.encodings?.length ? p.encodings : [{}];
          p.encodings[0].maxBitrate = 6_000_000;
          s.setParameters(p).catch(() => {});
        }
        await gathered(pc);
        sigPost({ type: 'offer', to: m.from, sdp: pc.localDescription.sdp });
      } else if (m.type === 'answer') {
        await link.pcs.get(m.from)?.setRemoteDescription({ type: 'answer', sdp: m.sdp }).catch(() => {});
      } else if (m.type === 'peer-leave') {
        link.pcs.get(m.from)?.close();
        link.pcs.delete(m.from);
      }
      updateLinkUI();
    };
    // 生存通知(途絶えるとサーバーが部屋を片付ける)
    link.hbTimer = setInterval(() => sigPost({ type: 'hb' }), 20000);
    keepAwake();
    updateLinkUI();
  };
  // カメラを切り替えたら送信中の映像も差し替える
  const onCamChanged = () => {
    if (link.role !== 'send' || !camStream) return;
    const track = camStream.getVideoTracks()[0];
    for (const pc of link.pcs.values()) for (const s of pc.getSenders()) s.replaceTrack(track).catch(() => {});
    updateLinkUI();
  };

  // 受信(iPad): 送信中の端末を一覧から選ぶ
  const listSenders = async () => {
    syncSigUrl();
    if (!sigBase()) return lpStatus('中継サーバーのURLを入れて');
    let list;
    try { list = await (await fetch(`${sigBase()}/rooms`)).json(); }
    catch (e) { return sigErr(e); }
    lpStatus(list.length ? '見る端末を選ぶ' : '送信中の端末なし(iPhoneで「このカメラを送る」を押す)');
    $('#lpList').replaceChildren(...list.map((r) => {
      const b = document.createElement('button');
      b.textContent = `${r.name}(${Math.round((Date.now() - r.since) / 60000)}分前から)`;
      b.onclick = () => startRecv(r.room, r.name);
      return b;
    }));
  };
  const startRecv = async (room, name) => {
    clearInterval(link.listTimer);
    $('#lpList').replaceChildren();
    link.role = 'recv'; link.room = room;
    lpStatus(`${name} に接続中…`);
    try { link.es = await openEvents(''); }
    catch (e) { link.role = null; updateLinkUI(); return sigErr(e); }
    link.es.onmessage = async (e) => {
      const m = JSON.parse(e.data);
      if (m.type === 'offer') {
        link.pcs.get(m.from)?.close();
        const pc = new RTCPeerConnection(RTC_CFG);
        link.pcs.set(m.from, pc);
        pc.ontrack = (ev) => {
          remoteVideo.srcObject = ev.streams[0] || new MediaStream([ev.track]);
          remoteVideo.play().catch(() => {});
          stopCam(); $('#selCam').hidden = true;
          base = { el: remoteVideo, cam: false, remote: true };
          syncUI();
        };
        pc.onconnectionstatechange = () => {
          if (pc.connectionState === 'connected') lpStatus(`受信中: ${name}`);
          if (pc.connectionState === 'failed') lpStatus('映像をつなげなかった(同じWi-Fiか確認)');
        };
        await pc.setRemoteDescription({ type: 'offer', sdp: m.sdp });
        await pc.setLocalDescription(await pc.createAnswer());
        await gathered(pc);
        sigPost({ type: 'answer', to: m.from, sdp: pc.localDescription.sdp });
      } else if (m.type === 'room-closed') {
        stopLink();
        lpStatus('送信が終わった');
      }
    };
    keepAwake();
    updateLinkUI();
  };

  // 中継サーバーへ退出を知らせる(プロキシ越しだと接続を閉じただけでは伝わらないことがある)
  const sendLeave = () => {
    if (!link.room) return;
    const body = JSON.stringify({ type: 'leave', from: link.me });
    const url = `${sigBase()}/rooms/${link.room}`;
    if (!navigator.sendBeacon?.(url, body)) fetch(url, { method: 'POST', headers: { 'Content-Type': 'text/plain' }, body, keepalive: true }).catch(() => {});
  };
  addEventListener('pagehide', sendLeave);

  const stopLink = () => {
    clearInterval(link.listTimer);
    clearInterval(link.hbTimer);
    sendLeave();
    link.es?.close();
    for (const pc of link.pcs.values()) pc.close();
    link.pcs.clear();
    if (link.role === 'recv' && base?.remote) { base = null; remoteVideo.srcObject = null; syncUI(); }
    link.role = null; link.es = null; link.room = null;
    if (!document.body.classList.contains('fs')) { wakeLock?.release().catch(() => {}); wakeLock = null; }
    updateLinkUI();
    lpStatus('');
  };

  $('#btnLink').onclick = () => {
    const p = $('#linkPanel');
    p.hidden = !p.hidden;
    $('#lpUrl').value = ST.sigUrl;
    if (!p.hidden && !link.role) lpStatus(sigBase() ? '' : '中継サーバーのURLを入れて');
  };
  $('#lpClose').onclick = () => { $('#linkPanel').hidden = true; clearInterval(link.listTimer); };
  $('#lpUrl').onchange = (e) => { ST.sigUrl = e.target.value.trim(); save(); };
  $('#lpSend').onclick = startSend;
  $('#lpRecv').onclick = () => { listSenders(); clearInterval(link.listTimer); link.listTimer = setInterval(listSenders, 3000); };
  $('#lpStop').onclick = stopLink;
  // ?sig=URL 付きで開くと中継サーバーを設定して、URLから消す
  {
    const q = new URLSearchParams(location.search);
    if (q.get('sig')) {
      ST.sigUrl = q.get('sig'); save();
      q.delete('sig');
      history.replaceState(null, '', location.pathname + (q.toString() ? `?${q}` : '') + location.hash);
      toast('中継サーバーを設定した');
    }
  }

  // ---- 全画面 ----
  // iPhoneのSafariはページの全画面化に非対応。URLバーが消えるのはホーム画面から開いたときだけ
  const isIOS = /iP(hone|od|ad)/.test(navigator.platform) || (navigator.userAgent.includes('Mac') && 'ontouchend' in document);
  const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
  const fsElement = () => document.fullscreenElement || document.webkitFullscreenElement;
  let wakeLock = null, fsTimer = 0;
  const keepAwake = async () => {
    try { wakeLock = await navigator.wakeLock?.request('screen'); } catch (e) {}
  };
  const showFsCtl = () => {
    $('#fsCtl').classList.remove('hide');
    clearTimeout(fsTimer);
    fsTimer = setTimeout(() => $('#fsCtl').classList.add('hide'), 3000);
  };
  const setFs = async (on) => {
    document.body.classList.toggle('fs', on);
    if (on) {
      const el = document.documentElement;
      if (!fsElement()) {
        if (el.requestFullscreen) await el.requestFullscreen({ navigationUI: 'hide' }).catch(() => {});
        else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
      }
      if (!fsElement() && isIOS && !standalone) toast('URLバーも隠すには、共有 > ホーム画面に追加 から開く');
      keepAwake();
      $('#fsOpacity').value = ST.opacity;
      showFsCtl();
    } else {
      guidesHidden = false;
      $('#fsGuides').textContent = 'ガイド';
      if (fsElement()) (document.exitFullscreen || document.webkitExitFullscreen).call(document)?.catch?.(() => {});
      wakeLock?.release().catch(() => {});
      wakeLock = null;
    }
  };
  // Escキーなどでブラウザの全画面が解除されたら、こちらも戻す
  const onFsChange = () => { if (!fsElement() && document.body.classList.contains('fs') && !isIOS) setFs(false); };
  document.addEventListener('fullscreenchange', onFsChange);
  document.addEventListener('webkitfullscreenchange', onFsChange);
  // 画面がバックグラウンドに回るとスリープ防止が外れるので取り直す
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && document.body.classList.contains('fs')) keepAwake();
  });
  $('#btnFs').onclick = () => setFs(true);
  $('#fsExit').onclick = () => setFs(false);
  $('#fsPrev').onclick = () => { select(cur - 1); showFsCtl(); };
  $('#fsNext').onclick = () => { select(cur + 1); showFsCtl(); };
  $('#fsOpacity').oninput = (e) => { ST.opacity = +e.target.value; $('#rngOpacity').value = ST.opacity; save(); showFsCtl(); };
  $('#fsGuides').onclick = (e) => { guidesHidden = !guidesHidden; e.target.textContent = guidesHidden ? 'ガイドなし' : 'ガイド'; showFsCtl(); };
  stage.addEventListener('pointerdown', () => { if (document.body.classList.contains('fs')) showFsCtl(); });

  document.addEventListener('keydown', (e) => {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
    if (e.key === 'f' || e.key === 'F') return setFs(!document.body.classList.contains('fs'));
    if (e.key === 'ArrowLeft') select(cur - 1);
    else if (e.key === 'ArrowRight') select(cur + 1);
    else if (e.key === '1' || e.key === '2' || e.key === '3') { ST.mode = ['overlay', 'side', 'wipe'][+e.key - 1]; syncUI(); }
  });
  // ドラッグ&ドロップ / 貼り付け
  let dragDepth = 0;
  document.addEventListener('dragenter', (e) => { e.preventDefault(); dragDepth++; $('#drop').style.display = 'flex'; });
  document.addEventListener('dragleave', () => { if (--dragDepth <= 0) { dragDepth = 0; $('#drop').style.display = 'none'; } });
  document.addEventListener('dragover', (e) => e.preventDefault());
  document.addEventListener('drop', (e) => {
    e.preventDefault(); dragDepth = 0; $('#drop').style.display = 'none';
    addFiles([...e.dataTransfer.files]);
  });
  document.addEventListener('paste', (e) => {
    const files = [...e.clipboardData.files];
    if (files.length) addFiles(files);
  });

  syncUI();
  renderStrip();
  loadSavedGuides();
  requestAnimationFrame(render);
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
  window.__cc = { addFiles, addGuides, get guides() { return customGuides; }, saveTemplate, get refs() { return refs; }, ST, syncUI, setBase: (el) => { base = { el, cam: false }; syncUI(); } };
})();
</script>
</body>
</html>
